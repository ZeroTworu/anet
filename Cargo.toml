[workspace]
resolver = "2"
members = ["anet-server", "anet-client-cli", "anet-common", "anet-keygen", "anet-client-core", "anet-mobile", "anet-client-gui", "anet-auth", "anet-appfilter"]
default-members = ["anet-server", "anet-client-cli", "anet-common", "anet-auth", "anet-client-gui", "anet-keygen"]


[workspace.dependencies]
tun = { version = "0.8.5", features = ["async"] }
tokio = {version = "1.47.1", features = ["full"]}
env_logger = "0.11.8"
log = { version = "0.4.22", default-features = false}
rustls = { version = "0.23.31", default-features = false, features = ["ring"] }
anyhow = "1.0.99"
bytes = "1.10.1"
prost = "0.14.1"
clap = { version = "4.5.47", default-features = false, features = ["std", "derive"] }
rustls-pemfile = "2.2.0"
base64 = "0.22.1"
rand = { version = "0.8", features = ["std"] }
chacha20poly1305 = "0.10.1"
quinn = {version = "0.11.11", features = ["rustls", "ring"]}
serde = { version = "1.0.219", features = ["derive"] }
toml = "0.9.8"
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
ed25519-dalek = { version = "2.1.1", features = ["std", "rand_core"] }
sha2 = "0.10.9"
async-trait = "0.1.89"
netdev = { version = "0.39", features = ["gateway"] }
ipnet = "2.11.0"
futures = "0.3.31"
russh = "0.62.6"
tokio-tungstenite = { version = "0.28.0", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
http = "1.3.1"
windows-sys = { version = "0.59" }
dashmap = { version = "7.0.0-rc2" }
reqwest = { version = "0.12.28", default-features = false }

[profile.release.package.anet-client-cli]
debug = 2
codegen-units = 1

[profile.release.package.anet-client-gui]
debug = 2
codegen-units = 1

[profile.release.package.anet-mobile]
debug = 2
codegen-units = 1

[profile.release.package.anet-server]
debug = 2
codegen-units = 1

[profile.release.package.anet-common]
debug = 2
codegen-units = 1

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = 'abort'
incremental = false


[profile.release.package."*"]
opt-level = 3

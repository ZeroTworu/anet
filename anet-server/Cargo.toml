[package]
name = "anet-server"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
tokio = {workspace = true }
rustls = {workspace = true }
env_logger = {workspace = true}
log = {workspace = true}
anyhow = {workspace = true}
clap = {workspace = true}
prost = {workspace = true}
bytes = {workspace = true}
rustls-pemfile = {workspace = true}
base64 = {workspace = true}
rand = {workspace = true}
chacha20poly1305 = {workspace = true}
quinn = {workspace = true }
serde = { workspace = true, features = ["derive"] }
toml = {workspace = true}
x25519-dalek = {workspace = true}
ed25519-dalek = {workspace = true}
async-trait = { workspace = true }
futures = { workspace = true }
tokio-tungstenite = { workspace = true }
dashmap = { workspace = true }
reqwest = { workspace = true, default-features = false, features = ["json", "rustls-tls"] }

russh = { workspace = true }


arc-swap = "1.6"

# eBPF-шейпер трафика (per-user speed_limit) на TUN-интерфейсе, см. src/shaper.rs
anet-ebpf-common = { path = "../anet-ebpf-common", features = ["user"] }
aya = { workspace = true }
aya-log = { workspace = true }

anet-common = { path = "../anet-common", features = ["poem"] }
httparse = "1.10.1"
url = "2.5.7"

[dev-dependencies]
anet-client-core = { path = "../anet-client-core" }

[build-dependencies]
# Только как путь к манифесту для build.rs/aya-build — Rust-код отсюда не
# импортируется, крейт anet-ebpf компилируется отдельно под bpfel-unknown-none
# нужным ему nightly-тулчейном (см. build.rs), стабильный тулчейн, которым
# собирается сам anet-server, не переключается.
aya-build = { workspace = true }

[[bin]]
name = "anet-server"
path = "src/main.rs"

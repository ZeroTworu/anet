# =========================================================================
# ANET Client: базовый шаблон конфигурации, который панель заполняет динамически
# =========================================================================
[main]
# Название виртуального адаптера
tun_name = "anet-client"

# Включает ручное управление роутингом на клиенте
manual_routing = false

# Windows per-app split tunneling.
# include-режим: в туннель идут ТОЛЬКО эти процессы.
# per_app = ["firefox.exe", "telegram.exe"]
# per_app_mode = "include"

per_app = {{PER_APP}}
per_app_mode = "{{PER_APP_MODE}}"

# exclude-режим (в туннель всё, КРОМЕ этих):
# per_app = ["steam.exe"]
# per_app_mode = "exclude"

# Настройки Маршрутизации (Split Tunneling)
route_for = {{ROUTE_FOR}}
exclude_route_for = {{EXCLUDE_ROUTE_FOR}}

# Список DNS-серверов, используемых при запуске для резолва доменов
dns_server_list = ["1.1.1.1", "8.8.8.8"]

# Ссылка для скачивания авто-обновлений клиента
update_url = "https://api.github.com/repos/ZeroTworu/anet/releases/latest"

[keys]
# Эти параметры бэкенд дешифрует и заполнит автоматически при скачивании
private_key = "{{PRIVATE_KEY}}"
server_pub_key = "{{SERVER_PUB_KEY}}"

[stats]
enabled = true
interval_minutes = 1

[ahttp]
# --- Параметры параллельности и коалесценции пакетов (оптимизировано для работы напрямую без CDN) ---
# В dsn ноды [[servers]] также поддерживаются точечные query-параметры:
#   ?cdn=1 (профиль для CDN, батч 48 КБ), ?budget=49152, ?pool=4, ?method=POST

# Количество параллельно открываемых HTTP/2 запросов (потоков)
concurrency = 12
# concurrency = 8 # для CDN

# Количество постоянных независимых TCP/TLS соединений (HTTP/2 клиентов) в Round-Robin пуле
tcp_pool_size = 4
# tcp_pool_size = 2 # для CDN

# Максимальный размер пачки пакетов в байтах (общий бюджет коалесценции: 128 КБ напрямую под серверный лимит)
coalesce_budget_bytes = 131072
# coalesce_budget_bytes = 65536 # для CDN

# Отдельный лимит размера Uplink POST-батча (напрямую не ограничиваем — используется coalesce_budget_bytes)
# uplink_coalesce_budget_bytes = 49152 # для CDN (48 КБ, чтобы POST уходил за 1 RTT в стартовом окне HTTP/2 65535 Б)

# Интервал фонового опроса сервера в мс (при активном скачивании работает self-clocking без ожидания таймера)
poll_timeout_ms = 5
# poll_timeout_ms = 15 # для CDN (снижает фоновый RPS, чтобы не триггерить rate-limit на edge-нодах)

# Максимальный размер скользящего окна переупорядочивания пакетов (ReassemblyQueue)
reassembly_queue_max_size = 2048
# reassembly_queue_max_size = 1024 # для CDN

# --- Тонкая настройка HTTP/2 на уровне сетевого движка ---

# Автоматическое динамическое расширение окна HTTP/2 под BDP канала (Adaptive Flow Control Window)
http2_adaptive_window = true
# http2_adaptive_window = false # для CDN (при жёстком лимите окна на edge-узле CDNVideo)

# Ручные окна потока и соединения HTTP/2 (применяются ТОЛЬКО если http2_adaptive_window = false)
# http2_initial_stream_window_size = 2097152     # без CDN (2 МБ, если http2_adaptive_window = false)
# http2_initial_connection_window_size = 8388608 # без CDN (8 МБ, если http2_adaptive_window = false)
# http2_initial_stream_window_size = 49152       # для CDN (48 КБ под окно CDNVideo)
# http2_initial_connection_window_size = 49152   # для CDN (48 КБ под окно CDNVideo)

# Максимальный размер одного HTTP/2 DATA-фрейма (64 КБ напрямую снижает оверхед заголовков фреймов в 4 раза)
http2_max_frame_size = 65536
# http2_max_frame_size = 16384 # для CDN (стандартный RFC 7540 фрейм 16 КБ для строгих CDN)

# Максимальный размер входящих HTTP-заголовков (в байтах)
http2_max_header_list_size = 65536
# http2_max_header_list_size = 16384 # для CDN

# Период отправки фоновых Keep-Alive PING кадров HTTP/2 (в секундах)
http2_keep_alive_interval_secs = 20
# http2_keep_alive_interval_secs = 15 # для CDN

# Таймаут подтверждения (ACK) отправленного PING-кадра (в секундах)
http2_keep_alive_timeout_secs = 10
# http2_keep_alive_timeout_secs = 10 # для CDN

# Отправлять ли PING-кадры, когда в туннеле нет активной передачи данных (Idle-режим)
http2_keep_alive_while_idle = true

# --- Конфигурация пула соединений и путей ---

# Максимальное количество удерживаемых открытыми (idle) сокетов на каждый клиент пула (должно быть >= concurrency)
pool_max_idle_per_host = 16
# pool_max_idle_per_host = 8 # для CDN

# Время простоя соединения в пуле перед его автоматическим закрытием (в секундах)
pool_idle_timeout_secs = 90
# pool_idle_timeout_secs = 45 # для CDN

# Отключение алгоритма Nagle (TCP_NODELAY) для мгновенной отправки фреймов
tcp_nodelay = true

# Тайм-аут на выполнение одного HTTP-запроса обмена батчем (в секундах)
timeout_secs = 10
# timeout_secs = 15 # для CDN

# Пути эндпоинтов (должны строго совпадать с настройками на сервере)
handshake_path = "/handshake"
auth_path = "/auth"
traffic_path = "/traffic"

[stealth]
frag_enabled = true
frag_min_chunks = 2
frag_max_chunks = 3
min_jitter_ns = 1000000   # 1 ms
max_jitter_ns = 5000000   # 5 ms
padding_step = 64
# -------------------------------------------------------------------------
# Маскировка TLS-отпечатка BoringSSL (JA3/JA4) и синхронизация с HTTP (L4/L7)
# -------------------------------------------------------------------------
# Управляет профилем TLS ClientHello и автоматически синхронизирует с ним
# HTTP-заголовки (User-Agent, Accept-Encoding, наличие или отсутствие sec-ch-ua*):
#   - "auto"       : (По умолчанию) Случайный выбор реалистичного браузера под текущую ОС
#                    (Chrome / Firefox / Safari / Randomized) со 100% синхронизацией L4 и L7.
#   - "chrome"     : Google Chrome / Edge (GREASE включен, перестановка расширений,
#                    кривые X25519MLKEM768/X25519:P-256:P-384, OCSP+SCT, заголовки sec-ch-ua*).
#   - "firefox"    : Mozilla Firefox NSS (GREASE выключен, фиксированный порядок расширений,
#                    кривые X25519:P-256:P-384:P-521, ChaCha20 перед AES-256, БЕЗ sec-ch-ua*).
#   - "safari"     : Apple Safari / WebKit (GREASE без перестановки расширений,
#                    кривые X25519:P-256:P-384:P-521, OCSP+SCT, БЕЗ sec-ch-ua*).
#   - "randomized" : Полиморфный браузерный отпечаток — рандомизирует набор расширений,
#                    порядок кривых и шифров TLS 1.2 в рамках валидного браузера для каждой сессии,
#                    защищая от сигнатурного бана по статическому JA3/JA4 хешу на ТСПУ.
#
# Может быть переопределен точечно для конкретного узла в [[servers]] или в DSN (?fp=firefox).
tls_fingerprint = "auto"

# -------------------------------------------------------------------------
# Защита от активного спуфинга ТСПУ (MITM / подмена TLS-сертификата)
# -------------------------------------------------------------------------
# Защищает транспорты AHTTP, WebSocket, WRTC и DoH от активного перехвата
# TLS-рукопожатия оборудованием ТСПУ (инжект поддельного ServerHello/Certificate
# с целью расшифровать первый пакет и обнаружить скрытый путь /handshake или /socket).
#
# При tls_verify_peer = true (включено по умолчанию):
#   1. Клиент проверяет цепочку сертификата сервера по системному хранилищу корневых CA
#      и сверяет соответствие домена SNI (SubjectAltName) ИЛИ проверяет SHA-256 пин.
#   2. Если ТСПУ подменяет сертификат на самоподписанный или чужой домен-заглушку,
#      клиент мгновенно обрывает соединение НА ЭТАПЕ TLS HANDSHAKE до отправки
#      первого байта полезной нагрузки (0 байт HTTP/WS/ASTP данных утекает в сенсор DPI).
#
# Установите false (глобально здесь или в [[servers]] / ?verify=0), ТОЛЬКО если вы
# подключаетесь к тестовому узлу с самоподписанным сертификатом без настроенного tls_pin_sha256.
tls_verify_peer = true

[quic_transport]
algorithm = "bbr"
expected_rtt_ms = 75
bandwidth_down_mbps = 200
bandwidth_up_mbps = 200

# Буферы увеличены до 32 MB для снятия любых ограничений на скачивание
receive_window = 33554432
stream_receive_window = 33554432
send_window = 33554432

enable_gso = true
idle_timeout_seconds = 21600

# Ограничение физического размера кадра для удаления IP-фрагментации
max_mtu = 1400

keep_alive_interval_seconds = 20

[routing]
# Автоматическое обновление скомпилированного кэша правил Smart DNS & AdBlock (rules.abc)
rules_url = "{{RULES_URL}}"

[wrtc]
# Тайм-ауты сигнализации KTalk HTTP API и XMPP/Colibri WebSocket (в секундах)
http_connect_timeout_secs = 10
http_request_timeout_secs = 15
xmpp_handshake_timeout_secs = 15
ws_write_timeout_secs = 5
colibri_ws_connect_timeout_secs = 10

# Системные буферы UDP-сокета (8 MB) и пул потоков реактора WebRTC
udp_socket_buffer_size = 8388608
reactor_pool_size = 4

# Тайм-ауты проверки связности ICE (в миллисекундах) и интервал обновления TURN/TURNS-аллокации (в секундах)
ice_disconnected_timeout_ms = 10000
ice_failed_timeout_ms = 25000
ice_keepalive_interval_ms = 2000
turn_refresh_interval_secs = 90

# Параметры буферов и MTU для SCTP (DataChannel) и RTP-приемника
sctp_max_receive_buffer_size = 8388608
sctp_mtu = 1200
receive_mtu = 1600

# Запас MTU под заголовки IPv4+UDP+SRTP+RTP+VP8+ASTP (110 байт) и интервал VP8 keep-alive (мс)
video_mtu_overhead = 110
video_keepalive_interval_ms = 1000

# Сторожевые таймеры (watchdog) контроля состояния WebRTC и внутритуннельного тракта (в секундах)
watchdog_disconnected_timeout_secs = 8
watchdog_channel_grace_secs = 12
peer_close_timeout_secs = 3
tunnel_ping_interval_secs = 15
tunnel_ping_timeout_secs = 45
server_idle_room_rotation_secs = 1800

[connectivity]
# Включить фоновую диагностику состояния сети и линейный индикатор пульса (true / false)
enabled = true

# Интервал отправки внутритуннельных ICMP-пингов для замера RTT при подключенном туннеле (в секундах, рекомендуется 1–2 с)
ping_interval_secs = 2

# Интервал опроса контрольных точек для оценки состояния внешних и локальных маршрутов (в секундах, рекомендуется 2–6 с)
probe_interval_secs = 4

# Тайм-аут ожидания ответа от одной контрольной точки при проверке связности (в миллисекундах)
timeout_ms = 2500

# Глобальные контрольные точки (проверка доступности внешних международных маршрутов)
global_targets = [
    "https://www.google.com/generate_204",
    "https://connectivitycheck.gstatic.com/generate_204",
    "https://store.steampowered.com/favicon.ico",
]

# Локальные контрольные точки (проверка базовой внутренней связности при деградации внешних маршрутов)
domestic_targets = [
    "https://ya.ru",
    "https://vk.com",
    "https://www.gosuslugi.ru",
]

# =========================================================================
# Профили браузерной мимикрии L4 (TLS ClientHello) и L7 (HTTP/2 + WebSocket)
# =========================================================================
# Встроенные дефолты зашиты в бинарник, но продублированы здесь, чтобы любые
# шифры, кривые, расширения, окна HTTP/2, порядок WS-заголовков и User-Agent
# можно было переопределить без пересборки клиента.
[[browser_profiles]]
name = "Chrome"
cipher_list = "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-RSA-AES128-SHA:ECDHE-RSA-AES256-SHA:AES128-GCM-SHA256:AES256-GCM-SHA384:AES128-SHA:AES256-SHA"
curves = "X25519MLKEM768:X25519:P-256:P-384"
sigalgs = "ecdsa_secp256r1_sha256:rsa_pss_rsae_sha256:rsa_pkcs1_sha256:ecdsa_secp384r1_sha384:rsa_pss_rsae_sha384:rsa_pkcs1_sha384:rsa_pss_rsae_sha512:rsa_pkcs1_sha512"
grease = true
permute_extensions = true
session_ticket = true
ocsp_stapling = true
signed_cert_timestamps = true
ech_grease = true
alps_h2 = true
cert_compression = ["brotli"]
h2_initial_stream_window_size = 6291456
h2_initial_connection_window_size = 15728640
h2_max_header_list_size = 262144
ws_headers_order = [
    "Host",
    "Connection",
    "Pragma",
    "Cache-Control",
    "User-Agent",
    "Upgrade",
    "Origin",
    "Sec-WebSocket-Version",
    "Accept-Encoding",
    "Accept-Language",
    "Sec-WebSocket-Key",
    "Sec-WebSocket-Extensions",
]
user_agents = [
    "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/135.0.0.0 Safari/537.36",
    "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/136.0.0.0 Safari/537.36 Edg/136.0.0.0",
    "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/136.0.0.0 Safari/537.36",
]
headers = [
    "Accept-Language: ru-RU,ru;q=0.9,en-US;q=0.8,en;q=0.7",
    "Accept-Encoding: gzip, deflate, br, zstd",
]


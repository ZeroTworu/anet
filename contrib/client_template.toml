# =========================================================================
# ANET Client: базовый шаблон конфигурации, который панель заполняет динамически
# =========================================================================
[main]
# Название виртуального адаптера
tun_name = "anet-client"

# Включает ручное управление роутингом на клиенте
manual_routing = false

# Windows per-app split tunneling.
# include-режим: в туннель идут ТОЛЬКО эти процессы.
# per_app = ["firefox.exe", "telegram.exe"]
# per_app_mode = "include"

per_app = {{PER_APP}}
per_app_mode = "{{PER_APP_MODE}}"

# exclude-режим (в туннель всё, КРОМЕ этих):
# per_app = ["steam.exe"]
# per_app_mode = "exclude"

# Настройки Маршрутизации (Split Tunneling)
route_for = {{ROUTE_FOR}}
exclude_route_for = {{EXCLUDE_ROUTE_FOR}}

# Список DNS-серверов, используемых при запуске для резолва доменов
dns_server_list = ["1.1.1.1", "8.8.8.8"]

# Ссылка для скачивания авто-обновлений клиента
update_url = "https://api.github.com/repos/ZeroTworu/anet/releases/latest"

[keys]
# Эти параметры бэкенд дешифрует и заполнит автоматически при скачивании
private_key = "{{PRIVATE_KEY}}"
server_pub_key = "{{SERVER_PUB_KEY}}"

[stats]
enabled = true
interval_minutes = 1

[ahttp]
# --- Параметры параллельности и коалесценции пакетов ---

# Количество параллельно открываемых HTTP/2 запросов в сторону CDN (Concurrency).
# Рекомендуемый диапазон: от 4 до 16. Полностью нивелирует задержки пинга (RTT) за счет
# мультиплексирования независимых сетевых фреймов внутри одной TCP-сессии.
concurrency = 8

# Максимальный размер пачки пакетов в байтах перед принудительной отправкой (бюджет коалесценции).
# Рекомендуется держать 65536 (64 КБ) для обеспечения высокого КПД при скачивании файлов.
coalesce_budget_bytes = 65536

# Задержка накопления пачки (в миллисекундах). Если новых пакетов из туннеля нет,
# клиент отправит пустой опрос (Poll) через этот интервал для поддержания сессии.
# Рекомендуемый диапазон: от 10 до 25 мс.
poll_timeout_ms = 15

# --- Тонкая настройка HTTP/2 на уровне сетевого движка ---

# Автоматическое динамическое расширение окна HTTP/2 (Adaptive Flow Control Window).
# Переопределяет статические ограничения и существенно поднимает скорость на качественных Anycast-каналах.
http2_adaptive_window = true

# Максимальный размер кадра (Frame Size) для HTTP/2 (в байтах).
# Пустое значение (None) оставляет выбор за дефолтным оптимизатором reqwest (~16384).
# http2_max_frame_size = 16384

# Максимальный размер входящих HTTP-заголовков (в байтах). Должен соответствовать лимитам сервера.
http2_max_header_list_size = 16384

# Период отправки фоновых Keep-Alive PING кадров HTTP/2 (в секундах) для обхода таймаутов CDN.
http2_keep_alive_interval_secs = 20

# Таймаут подтверждения (ACK) отправленного PING-кадра. При превышении сокет перезапускается.
http2_keep_alive_timeout_secs = 10

# Отправлять ли PING-кадры, когда в туннеле нет активной передачи данных (Idle-режим).
# Рекомендуется true во избежание протухания сессий на пограничных CDN-серверах.
http2_keep_alive_while_idle = true

# --- Конфигурация пула соединений и путей ---

# Максимальное количество удерживаемых открытыми (idle) TCP-сокетов в пуле клиента к CDN
pool_max_idle_per_host = 8

# Время простоя соединения в пуле перед его автоматическим закрытием (в секундах)
pool_idle_timeout_secs = 60

# Отключение алгоритма Nagle (TCP_NODELAY) для снижения задержки
tcp_nodelay = true

# Тайм-аут на выполнение одного HTTP-запроса (в секундах)
timeout_secs = 10

# Пути обфускации (должны строго совпадать с настройками на сервере)
handshake_path = "/handshake"
auth_path = "/auth"
traffic_path = "/traffic"

[stealth]
frag_enabled = true
frag_min_chunks = 2
frag_max_chunks = 3
min_jitter_ns = 1000000   # 1 ms
max_jitter_ns = 5000000   # 5 ms
padding_step = 64

[quic_transport]
algorithm = "bbr"
expected_rtt_ms = 75
bandwidth_down_mbps = 200
bandwidth_up_mbps = 200

# Буферы увеличены до 32 MB для снятия любых ограничений на скачивание
receive_window = 33554432
stream_receive_window = 33554432
send_window = 33554432

enable_gso = true
idle_timeout_seconds = 21600

# Ограничение физического размера кадра для удаления IP-фрагментации
max_mtu = 1400

keep_alive_interval_seconds = 20

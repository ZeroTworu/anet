# =========================================================================
# ANET Server: Настройки виртуальной сети
# =========================================================================
[network]
# IP-адрес сети, которая будет создана для VPN-клиентов.
# Все клиенты будут получать IP-адреса из этого диапазона.
net = "172.112.222.0"

# Маска подсети для виртуальной сети. Определяет размер сети
# и количество доступных IP-адресов для клиентов.
mask = "255.255.255.0"

# IP-адрес шлюза внутри виртуальной сети. Этот адрес будет использоваться
# клиентами как шлюз по умолчанию для маршрутизации всего их трафика.
gateway = "172.112.222.1"

# IP-адрес, который будет присвоен TUN-интерфейсу самого сервера.
# Этот адрес должен находиться в той же подсети, что и `net`.
self_ip = "172.122.222.2"

# Имя, которое будет присвоено виртуальному сетевому TUN-интерфейсу
# на стороне сервера.
if_name = "anet-server"

# Максимальный размер пакета (MTU) для TUN-интерфейса. Этот параметр
# критически важен для производительности.
#   - На чистом коннекте (1400): оставляет запас под заголовки QUIC/WebRTC/UDP/IP при стандартном канальном MTU 1500.
#   - При работе через CF WARP (1100): интерфейс WireGuard WARP (wgcf-profile) имеет жесткий MTU = 1280.
#     Снижение серверного MTU до 1100 (в паре с min_tun_mtu = 900 и max_video_batch_bytes = 960 в [wrtc])
#     гарантирует, что пакеты WebRTC/SRTP/VP8 (990 + 110 = 1100 Б) легко помещаются внутрь wgcf-profile без фрагментации и потерь.
mtu = 1400
# mtu = 1100 # для CF WARP (под узкий MTU 1280 интерфейса wgcf-profile, чтобы исключить дроп крупных пакетов на скачивании)

# =========================================================================
# ANET Server: Основные настройки сервера
# =========================================================================
[server]
# IP-адрес и порт, на котором сервер будет слушать входящие UDP-соединения.
# "0.0.0.0" означает, что сервер будет принимать подключения на всех доступных
# сетевых интерфейсах.
quic_bind_to = "0.0.0.0:4519"
ssh_bind_to = "0.0.0.0:822"
vnc_bind_to = "0.0.0.0:56678"

websocket_bind_to = "0.0.0.0:8080" # Биндим на локалхост для Nginx
websocket_path = "/socket"

ahttp_bind_to = "127.0.0.1:8081" # Биндим на локалхост для Nginx
ahttp_path = "/api/v2/telemetry"

ssh_host_key = "/opt/anet/anet_ssh_host_key"

# Маскированный транспорт WebRTC поверх Контур.Толк (Ktalk / Jitsi SFU)
# wrtc_room_url = "wrtc://example.ktalk.ru/example-room-id"
# wrtc_mode = "media_video"              # Режим транспорта: "media_video" (Fake Video Track over DTLS-SRTP / JVB) | "p2p_direct" | "jvb_datachannel" | "ws" | "auto"
wrtc_media_keepalive_interval_ms = 20  # Эмуляция Opus тишины (мс) для предотвращения таймаута JVB
wrtc_ping_interval_secs = 25           # Двойной пинг WebSocket и XMPP (сек) — для чистого коннекта
# wrtc_ping_interval_secs = 10         # для CF WARP (частый пинг XMPP/Colibri-WS не дает NAT Cloudflare WARP и Prosody закрыть сигнальный сокет во время нагрузок)
wrtc_fallback_jvb_ip = "89.169.16.6"   # Fallback IP медиасервера JVB при отсутствии в Jingle
wrtc_fallback_jvb_port = 10002         # Fallback UDP порт JVB

# Скрытный транспорт IMAP поверх почтовых провайдеров (Mail.ru / VK Cloud, порт 993/TLS)
# Поддерживает пул ящиков через ?acc=user1:pass1&acc=user2:pass2 для параллельного приема клиентов
# imap_dsn = "imaps://imap.mail.ru:993?acc=box1@mail.ru:app_password_1&acc=box2@mail.ru:app_password_2"

[ahttp]
# Пути, соответствующие путям в client.toml
handshake_path = "/handshake"
auth_path = "/auth"
traffic_path = "/traffic"

# Лимит буфера чтения HTTP-заголовков для защиты веб-сервера от DoS/Slowloris атак
max_header_bytes = 16384

# Маска HTTP-заголовков для ответа клиенту в фазе Traffic.
# Вы можете менять Content-Type (например, на image/jpeg), добавлять любые фейковые куки
# или кастомные заголовки вроде X-Cache-Status: HIT для мимикрии под кэш-промахи CDN.
# ВАЖНО: Символы {} обязательны — в них сервер автоматически подставит размер бинарной пачки (Content-Length).
response_headers = """
HTTP/1.1 200 OK
Content-Type: video/mp4
Cache-Control: no-cache, no-transform, private, must-revalidate
Pragma: no-cache
X-Accel-Buffering: no
Content-Length: {}
Connection: keep-alive\n\n"""

# Максимальный размер скользящего окна реассемблирования на сервере
reassembly_queue_max_size = 1024

# Бюджет коалесценции downlink-пакетов (в байтах).
# Рекомендуется 128 КБ (131072) для баланса пропускной способности и низкого джиттера.
coalesce_budget_bytes = 131072

# Задержка удержания poll-сессии сервером (в миллисекундах) при отсутствии пакетов.
# Рекомендуемый диапазон: 20 - 30 мс.
poll_timeout_ms = 25

# =========================================================================
# ANET Server: Аутентификация и авторизация
# =========================================================================
[authentication]
# Список "отпечатков" (fingerprints) публичных ключей клиентов, которым
# разрешено подключаться к серверу. Отпечаток генерируется утилитой
# `anet-keygen client`. Если клиент с другим отпечатком попытается
# подключиться, его запрос будет отклонен.
allowed_clients = []

# Список URL серверов авторизации (например, ["http://127.0.0.1:3000/api/v1"])
auth_servers = []

auth_server_token = ""

# =========================================================================
# ANET Control Plane: фактическое состояние узла в панели управления
# =========================================================================
[control_plane]
# UUID должен совпадать с UUID узла, созданного в ANet WebUI.
# Пустые node_id или url отключают heartbeat.
node_id = ""
url = "http://127.0.0.1:3000/api/v1"
# Индивидуальный credential ноды, выпущенный в админке. Панель показывает его
# только один раз и хранит у себя лишь SHA-256 хэш этого значения.
token = ""
heartbeat_interval_seconds = 15


# =========================================================================
# ANET Server: Криптографические ключи и сертификаты
# =========================================================================
[crypto]
# Сертификат сервера в формате PEM. Он используется для установления
# QUIC/TLS сессии. Клиент должен доверять этому сертификату.
# Содержимое файла `cert.pem` вставляется прямо сюда.
quic_cert = """
-----BEGIN CERTIFICATE-----
... (Содержимое cert.pem)
-----END CERTIFICATE-----
"""

# Приватный ключ для QUIC-сертификата в формате PEM.
# Содержимое файла `key.pem` вставляется прямо сюда.
# ВАЖНО: Храните этот ключ в секрете.
quic_key = """
-----BEGIN PRIVATE KEY-----
... (Содержимое key.pem)
-----END PRIVATE KEY-----
"""

# Приватный ключ сервера для подписи в формате Base64. Этот ключ
# используется для подписи эфемерного DH-ключа сервера на этапе рукопожатия.
# Это позволяет клиенту убедиться, что он говорит с настоящим сервером,
# а не с самозванцем. Генерируется утилитой `anet-keygen server`.
# ВАЖНО: Храните этот ключ в секрете.
server_signing_key = ""

# =========================================================================
# Настройки вывода статистики соединения
# =========================================================================
[stats]
# Включить (`true`) или выключить (`false`) периодический вывод в лог
# детальной статистики о состоянии QUIC-соединения. Полезно для
# отладки и мониторинга производительности.
# По умолчанию: false
enabled = true

# Интервал в минутах, с которым будет выводиться статистика в лог.
# Установите значение > 0.
# По умолчанию: 1
interval_minutes = 1

# =========================================================================
# Настройки маскировки трафика (Stealth)
# =========================================================================
# Эти параметры помогают скрыть факт использования VPN от систем DPI,
# изменяя размер пакетов и время их отправки.
[stealth]

# -------------------------------------------------------------------------
# Выравнивание размера пакетов (Padding)
# -------------------------------------------------------------------------
# Определяет "шаг" в байтах, до которого будет дополняться размер каждого пакета.
#
# Зачем это нужно:
# Без паддинга DPI видит реальный размер данных:
#   - 50-100 байт -> скорее всего, ввод команд в консоли (SSH) или ACK.
#   - 148 байт -> сигнатура WireGuard handshake.
#   - 1000+ байт -> передача файлов/видео.
# С паддингом все пакеты выглядят как унифицированные "кирпичи" (например, 64, 128, 192...).
# Это полностью скрывает тип активности пользователя.
#
# Значения:
#   0   - Отключено (режим "Хаос"). Пакеты имеют естественный размер.
#         Полезно против нейросетей, ищущих искусственные паттерны.
#   64  - (Рекомендуется) Баланс между скрытностью и расходом трафика.
#   128 - Высокая скрытность, но чуть больше накладных расходов (overhead).
#
# По умолчанию: 64
padding_step = 64

# -------------------------------------------------------------------------
# Имитация задержек сети (Jitter)
# -------------------------------------------------------------------------
# Добавляет случайную задержку перед отправкой каждого пакета.
# Значения указываются в наносекундах (ns).
# 1 миллисекунда (ms) = 1 000 000 наносекунд (ns).
#
# Зачем это нужно:
# DPI анализирует временные интервалы (Timing Analysis). Если пакет
# приходит на сервер и мгновенно улетает дальше, DPI понимает, что это прокси.
# Джиттер "размазывает" время доставки и меняет порядок пакетов (Reordering),
# делая поток похожим на работу обычной перегруженной сети.
#
# Рекомендации:
# 1. "Минимальный" (почти не влияет на пинг, сбивает точные тайминги):
#    min = 100000   (0.1 ms)
#    max = 500000   (0.5 ms)
#
# 2. "Сбалансированный" (хороший стелс, пинг +3мс):
#    min = 1000000  (1 ms)
#    max = 5000000  (5 ms)
#
# 3. "Параноидальный" (максимальная маскировка, пинг +15мс, возможны лаги в играх):
#    min = 5000000  (5 ms)
#    max = 20000000 (20 ms)
#
# Установите min и max в 0, чтобы отключить.

# Минимальная задержка (в наносекундах)
# По умолчанию: 1000000 (1 ms)
min_jitter_ns = 1000000

# Максимальная задержка (в наносекундах)
# По умолчанию: 5000000 (5 ms)
max_jitter_ns = 5000000

# Включить фрагментацию первого пакета
frag_enabled = false
frag_min_chunks = 2
frag_max_chunks = 3

# -------------------------------------------------------------------------
# Маскировка TLS-отпечатка BoringSSL (JA3/JA4) и синхронизация с HTTP (L4/L7)
# -------------------------------------------------------------------------
# Управляет профилем TLS ClientHello и автоматически синхронизирует с ним
# HTTP-заголовки (User-Agent, Accept-Encoding, наличие или отсутствие sec-ch-ua*):
#   - "auto"       : (По умолчанию) Случайный выбор реалистичного браузера под текущую ОС
#                    (Chrome / Firefox / Safari / Randomized) со 100% синхронизацией L4 и L7.
#   - "chrome"     : Google Chrome / Edge (GREASE включен, перестановка расширений,
#                    кривые X25519MLKEM768/X25519:P-256:P-384, OCSP+SCT, заголовки sec-ch-ua*).
#   - "firefox"    : Mozilla Firefox NSS (GREASE выключен, фиксированный порядок расширений,
#                    кривые X25519:P-256:P-384:P-521, ChaCha20 перед AES-256, БЕЗ sec-ch-ua*).
#   - "safari"     : Apple Safari / WebKit (GREASE без перестановки расширений,
#                    кривые X25519:P-256:P-384:P-521, OCSP+SCT, БЕЗ sec-ch-ua*).
#   - "randomized" : Полиморфный браузерный отпечаток — рандомизирует набор расширений,
#                    порядок кривых и шифров TLS 1.2 в рамках валидного браузера для каждой сессии,
#                    защищая от сигнатурного бана по статическому JA3/JA4 хешу на ТСПУ.
#
# Может быть переопределен точечно для конкретного узла в [[servers]] или в DSN (?fp=firefox).
# tls_fingerprint = "firefox"
tls_fingerprint = "chrome"

# -------------------------------------------------------------------------
# Защита от активного спуфинга ТСПУ (MITM / подмена TLS-сертификата)
# -------------------------------------------------------------------------
# Защищает транспорты AHTTP, WebSocket, WRTC и DoH от активного перехвата
# TLS-рукопожатия оборудованием ТСПУ (инжект поддельного ServerHello/Certificate
# с целью расшифровать первый пакет и обнаружить скрытый путь /handshake или /socket).
#
# При tls_verify_peer = true (включено по умолчанию):
#   1. Клиент проверяет цепочку сертификата сервера по системному хранилищу корневых CA
#      и сверяет соответствие домена SNI (SubjectAltName) ИЛИ проверяет SHA-256 пин.
#   2. Если ТСПУ подменяет сертификат на самоподписанный или чужой домен-заглушку,
#      клиент мгновенно обрывает соединение НА ЭТАПЕ TLS HANDSHAKE до отправки
#      первого байта полезной нагрузки (0 байт HTTP/WS/ASTP данных утекает в сенсор DPI).
#
# Установите false (глобально здесь или в [[servers]] / ?verify=0), ТОЛЬКО если вы
# подключаетесь к тестовому узлу с самоподписанным сертификатом без настроенного tls_pin_sha256.
tls_verify_peer = true

# =========================================================================
# Настройки транспорта QUIC (Quinn Transport Configuration)
# Эта секция определяет, как сервер будет управлять трафиком для всех
# подключенных клиентов. Так как сервер обслуживает множество соединений
# с разными характеристиками, настройки должны быть достаточно фрагментированы.
# =========================================================================
[quic_transport]
# -------------------------------------------------------------------------
# Алгоритм контроля перегрузки (Congestion Control Algorithm)
# -------------------------------------------------------------------------
# "bbr": Настоятельно рекомендуется для сервера. Этот алгоритм позволяет
#     эффективно работать с клиентами на самых разных типах сетей
#     (стабильных, с потерями, с высоким пингом), адаптируясь под
#     каждое соединение индивидуально.
# "cubic": Менее предпочтителен для сервера, так как может показывать
#     сниженную производительность для клиентов с нестабильным подключением.
algorithm = "bbr"

# -------------------------------------------------------------------------
# Обобщенные параметры канала
# -------------------------------------------------------------------------
# Среднеожидаемое время кругового пути (RTT) от клиентов в миллисекундах.
# Это значение используется как начальная точка для всех новых соединений.
# BBR быстро скорректирует его до реального значения для каждого клиента.
expected_rtt_ms = 60

# Оценка пропускной способности канала сервера для исходящего трафика
# (Download для клиента) в мегабитах в секунду.
# Укажите реальную скорость сетевого интерфейса вашего сервера. Это
# значение используется для автоматического расчета `send_window`.
bandwidth_down_mbps = 1000

# Оценка пропускной способности канала сервера для входящего трафика
# (Upload от клиента) в мегабитах в секунду.
# Используется для расчета `receive_window` и для настройки BBR.
bandwidth_up_mbps = 1000

# -------------------------------------------------------------------------
# Размеры буферов (Flow Control Windows)
# Рекомендуется оставить эти параметры незаполненными для автоматического расчета.
# -------------------------------------------------------------------------
# Размер окна приема для отдельного QUIC-потока от клиента, в байтах.
stream_receive_window = 33554432 # 32 MB (Синхронизировано с буфером соединения)

# Общий размер окна приема для всего соединения, в байтах. Ограничивает,
# какой объем данных сервер готов буферизовать от одного клиента.
# Напрямую влияет на скорость исходящего трафика (upload) клиента.
receive_window = 33554432        # 32 MB

# Общий размер окна отправки, в байтах. Определяет, какой объем данных
# сервер может отправить одному клиенту без ожидания подтверждений.
# Напрямую влияет на скорость входящего трафика (download) клиента.
send_window = 33554432           # 32 MB

# -------------------------------------------------------------------------
# Дополнительные оптимизации
# -------------------------------------------------------------------------
# Включение Generic Segmentation Offload (GSO). На сервере эта опция
# особенно важна, так как значительно снижает нагрузку на CPU при
# обслуживании множества высокоскоростных соединений.
enable_gso = true

# Таймаут неактивности соединения в секундах. Рекомендуется установить
# то же значение, что и на клиенте, для синхронного поведения.
idle_timeout_seconds = 21600

# Максимальный размер пакета для механизма Path MTU Discovery.
# Это "потолок", выше которого QUIC не будет пытаться поднять MTU.
# Зажато на 1400 для предотвращения фрагментации и скрытых потерь пакетов на уровне IP.
max_mtu = 1400
# -------------------------------------------------------------------------
# Интервал поддержания активности соединения (Keep-Alive)
# -------------------------------------------------------------------------
# Периодичность автоматической отправки минимальных зашифрованных пингов
# в секундах во время простоя (когда нет полезного трафика).
#
# Зачем это нужно:
# Протокол UDP не хранит состояние соединения (stateless). Когда вы заблокировали
# экран телефона или отошли от компьютера, полезный трафик перестает идти.
# В этот момент домашние роутеры и сотовые операторы начинают отсчет тайм-аута.
# Из-за нехватки адресов они очень быстро (часто уже через 30-60 секунд) закрывают
# временные порты маршрутизации в своих таблицах трансляции адресов (UDP NAT Timeout).
#
# Если это произойдет, сервер потеряет обратный путь до клиента, и туннель зависнет,
# а при разблокировке телефона соединение придется устанавливать заново.
#
# Регулярный Keep-Alive отправляет крошечные невидимые пакеты, которые «прогревают»
# сетевой тракт, заставляя оборудование провайдера постоянно держать порт открытым.
#
# Рекомендации:
#   0  - Отключено. (Допустимо только на стабильном проводном домашнем интернете).
#   15 - 25 - (Рекомендуется) Оптимальный интервал для мобильных сетей. Удерживает
#        NAT-таблицы открытыми, не расходуя при этом заряд батареи телефона.
#
# По умолчанию: 20
keep_alive_interval_seconds = 20

# =========================================================================
# Настройки eBPF-шейпера трафика (per-user speed_limit)
# =========================================================================
[shaper]
# Включает ограничение скорости на TUN-интерфейсе через встроенный eBPF
# (крейт anet-ebpf, собран прямо внутрь бинарника anet-server).
# Требует CAP_BPF + CAP_NET_ADMIN (см. contrib/systemd/anet-vpn.service)
# и qdisc `fq` на TUN-интерфейсе (настраивается автоматически при старте).
# По умолчанию: false
enabled = false

# =========================================================================
# Тонкая настройка транспорта WebRTC / Jitsi (секция [wrtc])
# =========================================================================
# Эти параметры управляют тайм-аутами сигнализации KTalk/XMPP, буферами
# сокетов UDP/SCTP, использованием TURN до медиасервера JVB, лимитами MTU
# и микро-батчинга для видео-потока VP8 (`media_video`), а также сторожевыми
# таймерами (watchdog) при работе WebRTC-сервера (если задан `wrtc_room_url`).
#
# Секция содержит два профиля значений (по аналогии с секцией [ahttp] у клиента):
#   1. Активные значения по умолчанию — оптимизированы для ЧИСТОГО (прямого)
#      коннекта сервера к инфраструктуре Контур.Толк (стандартный канальный MTU 1500, `[network] mtu = 1400`).
#   2. Закомментированные значения рядом (`# ... # для CF WARP`) — предназначены
#      для сценария, когда IP зарубежного сервера заблокирован на ТСПУ (трафик из/в РФ
#      напрямую не идет), и сервер выходит в контур KTalk через WireGuard-туннель
#      Cloudflare WARP (`wgcf-profile` с MTU = 1280 и policy-based роутингом).
[wrtc]

# --- Тайм-ауты сигнализации KTalk HTTP API и XMPP/Colibri WebSocket (в секундах) ---

# Тайм-аут TCP/TLS-подключения к HTTP API KTalk при создании/входе в комнату (сек).
http_connect_timeout_secs = 10
# http_connect_timeout_secs = 15 # для CF WARP (запас времени на установку TCP/TLS через дополнительный хоп wgcf-profile)

# Общий тайм-аут выполнения HTTP-запросов к API KTalk (сек).
http_request_timeout_secs = 15
# http_request_timeout_secs = 20 # для CF WARP (предотвращает таймаут авторизации сессии KTalk через WARP)

# Тайм-аут установки XMPP WebSocket соединения, SASL-авторизации, входа в MUC-комнату Jitsi
# и получения списка STUN/TURN серверов по XEP-0215 extdisco (сек).
xmpp_handshake_timeout_secs = 15
# xmpp_handshake_timeout_secs = 20 # для CF WARP (запас на полный цикл XMPP-сигнализации через WARP)

# Тайм-аут записи одного фрейма в WebSocket (XMPP или резервный Colibri-WS) (сек).
ws_write_timeout_secs = 5
# ws_write_timeout_secs = 15 # для CF WARP (предотвращает обрыв XMPP/Colibri-WS при кратковременных очередях в wgcf-profile под нагрузкой)

# Тайм-аут подключения резервного и управляющего канала Colibri-WS к медиасерверу JVB (сек).
colibri_ws_connect_timeout_secs = 10
# colibri_ws_connect_timeout_secs = 15 # для CF WARP (запас на установку TLS WebSocket до JVB через туннель WARP)

# --- Системные буферы UDP, реактор и параметры ICE / STUN / TURN ---

# Размер системных буферов сокета UDP (SO_RCVBUF / SO_SNDBUF) для медиа-трафика (в байтах).
# 8 МБ предотвращают потерю пакетов (packet drop) ядром ОС при микровсплесках видеопотока.
udp_socket_buffer_size = 8388608

# Количество выделенных потоков реактора WebRTC для обработки входящих/исходящих RTP-пакетов.
reactor_pool_size = 4

# Время отсутствия ответов STUN/ICE до перехода соединения в статус Disconnected (мс).
ice_disconnected_timeout_ms = 10000
# ice_disconnected_timeout_ms = 15000 # для CF WARP (устойчивость к кратковременному джиттеру STUN внутри UDP-туннеля WARP)

# Время до полного разрыва ICE-соединения (статус Failed) после потери связности (мс).
ice_failed_timeout_ms = 25000
# ice_failed_timeout_ms = 35000 # для CF WARP (защита от преждевременного сброса ICE при пиковой нагрузке на WARP)

# Интервал отправки проверочных STUN Binding Request (ICE keep-alive) (мс).
ice_keepalive_interval_ms = 2000
# ice_keepalive_interval_ms = 1500 # для CF WARP (более частый прогрев UDP-трансляции в NAT Cloudflare WARP)

# Интервал проактивного обновления TURN/TURNS-аллокации (Refresh) и nonce (сек).
turn_refresh_interval_secs = 90

# Разрешить ли использование TURN/TURNS релеев (включая локальные TCP-прокси `turns_proxy` на порт 443)
# при подключении сервера к центральному медиасерверу JVB (`WrtcPeer::create`).
# Примечание: в режиме `p2p_direct` TURN-релеи используются всегда независимо от этого флага.
#
# ЗАЧЕМ ЭТО НУЖНО:
#   - На чистом коннекте (`true`): служит страховкой, если хостинг-провайдер фильтрует прямой UDP до JVB.
#   - При работе через CF WARP (`false`): прямой UDP от сервера до JVB уже беспрепятственно идет внутри
#     WireGuard-туннеля `wgcf-profile`. Если оставить `true`, WebRTC поднимает локальные TCP-to-TLS прокси
#     (`turns_proxy -> *:443`) и собирает `relay`-кандидаты на TURN-узлах Контура. Так как TURN и JVB находятся
#     в одной подсети Яндекс.Облака, ICE часто переключает медиапоток на TCP-TURN прокси, что:
#       1) Уроняет скорость отдачи сервера (Download у клиента) в 5–7 раз из-за TCP Head-of-Line blocking;
#       2) Приводит к разрыву сессии через ~90–115 секунд по ошибке `TURN transaction timed out` и закрытию
#          JVB-канала с кодом `CloseFrame { code: Away, reason: "endpoint closed" }`.
jvb_use_turn = false
# jvb_use_turn = true # включать ТОЛЬКО если прямой UDP до JVB (10000-10010/udp) полностью заблокирован провайдером

# --- Параметры буферов, MTU и микро-батчинга VP8 (`media_video`) ---

# Максимальный размер приемного буфера SCTP (для транспорта `dc` / DataChannel) (в байтах).
sctp_max_receive_buffer_size = 8388608

# Максимальный размер полезной нагрузки SCTP-пакета внутри DTLS (в байтах).
sctp_mtu = 1200
# sctp_mtu = 1000 # для CF WARP (уменьшенный SCTP-чанк под MTU 1280 интерфейса wgcf-profile)

# Размер буфера чтения одного входящего UDP/RTP пакета в движке WebRTC (в байтах).
receive_mtu = 1600

# Запас (overhead) в байтах, вычитаемый из `[network] mtu` при расчете эффективного MTU
# для видео-транспорта (`media_video`) и максимального размера батча (`max_video_batch_bytes`).
# Учитывает заголовки внешнего IPv4 (20B) + UDP (8B) + SRTP (16B) + RTP (12B) +
# VP8 Payload Descriptor/Header (24B) + тег маршрутизации JVB (2B) + заголовок ASTP (28B) = 110 байт.
# Гарантирует отсутствие IP-фрагментации и черных дыр PMTU на магистралях хостинг-провайдеров.
video_mtu_overhead = 110
# video_mtu_overhead = 110 # для CF WARP (при [network] mtu = 1100 дает эффективный MTU туннеля 990 Б)

# Нижний допустимый предел автоматического расчета эффективного MTU туннеля (`network.mtu - video_mtu_overhead`) в байтах.
# Значение `900` позволяет честному расчету работать универсально:
#   - при `[network] mtu = 1250` (чистый коннект) эффективный MTU = `1140 Б` (`TCP MSS = 1100`);
#   - при `[network] mtu = 1100` (CF WARP, `wgcf-profile` MTU 1280) эффективный MTU = `990 Б` (`TCP MSS = 950`).
min_tun_mtu = 900

# Жесткий верхний предел размера одного склеенного VP8 RTP микро-батча (в байтах).
#
# ЗАЧЕМ ЭТО НУЖНО:
#   - На чистом коннекте (`1260`): обеспечивает максимальную пропускную способность при стандартном MTU 1500.
#   - При работе через CF WARP (`960`): ограничивает размер склеенной пачки IP-пакетов внутри одного VP8-кадра
#     до 960 байт. В сумме с заголовками WebRTC/SRTP/UDP/IPv4 (110 Б) и заголовками WireGuard WARP (60–80 Б)
#     пакет весит ~1150 Б и свободно проходит в `wgcf-profile` (MTU 1280) без фрагментации, потерь и просадок Download.
max_video_batch_bytes = 1260
# max_video_batch_bytes = 960 # для CF WARP (исключает переполнение MTU 1280 на wgcf-profile и поднимает скорость Download до уровня Upload)

# Максимальное количество мелких IP-пакетов, склеиваемых сервером в один VP8 RTP кадр без задержки (`1` отключает склейку).
video_batch_max_packets = 16
# video_batch_max_packets = 12 # для CF WARP (умеренное число пакетов в одном VP8-кадре для минимального джиттера через WARP)

# Максимальное количество пакетов за один цикл чтения из TUN (используется при общих настройках с клиентом).
uplink_burst_max_packets = 64
# uplink_burst_max_packets = 32 # для CF WARP

# Максимальный размер пачки пакетов (в байтах) для резервного батчера `Colibri-WS` и `DataChannel` (используется в режимах `jvb_datachannel`, `ws` и при стартовом прогреве видео).
ws_batcher_max_bytes = 12288
# ws_batcher_max_bytes = 4096 # для CF WARP (компактные фреймы WebSocket быстрее проходят через TCP внутри wgcf-profile)

# Максимальная задержка накопления пачки в резервном батчере `Colibri-WS` (в миллисекундах).
ws_batcher_max_delay_ms = 2
# ws_batcher_max_delay_ms = 2 # для CF WARP

# Интервал отправки фоновых холостых VP8-кадров (keep-alive) при отсутствии трафика (мс).
# Необходим, чтобы медиа-мост Jitsi (JVB) не замораживал и не отключал видео-трек.
video_keepalive_interval_ms = 1000
# video_keepalive_interval_ms = 500 # для CF WARP (частый прогрев UDP-сессии на JVB и в таблице NAT Cloudflare WARP)

# --- Сторожевые таймеры (watchdog) и ротация комнат (в секундах) ---

# Время нахождения PeerConnection в состоянии Disconnected до пересоздания пира (сек).
watchdog_disconnected_timeout_secs = 8
# watchdog_disconnected_timeout_secs = 12 # для CF WARP (дает ICE время пережить кратковременный сбой маршрута WARP без пересоздания комнаты)

# Льготный период на открытие хотя бы одного канала управления (DataChannel или Colibri-WS)
# после старта сессии до срабатывания сторожевого таймера (сек).
watchdog_channel_grace_secs = 12
# watchdog_channel_grace_secs = 15 # для CF WARP (дополнительный запас на инициализацию каналов через WARP)

# Тайм-аут ожидания штатного закрытия PeerConnection при завершении сессии (сек).
peer_close_timeout_secs = 3

# Интервал отправки внутритуннельных пингов (ASTP Keep-Alive) для проверки живого тракта (сек).
tunnel_ping_interval_secs = 15
# tunnel_ping_interval_secs = 10 # для CF WARP (частый контроль связности туннеля)

# Тайм-аут отсутствия входящих пакетов от клиента до закрытия его WRTC-сессии (сек).
tunnel_ping_timeout_secs = 45
# tunnel_ping_timeout_secs = 60 # для CF WARP (защита от сброса клиентской сессии при кратковременных задержках в WARP)

# Интервал профилактической ротации пустой комнаты на сервере при отсутствии клиентов (сек).
# По умолчанию: 1800 (30 минут).
server_idle_room_rotation_secs = 1800

# =========================================================================
# Тонкая настройка транспорта IMAP на сервере (секция [imap])
# =========================================================================
# Скрытный дуплексный транспорт поверх почтовых ящиков Mail.ru / VK Cloud (порт 993/TLS).
# Профиль TLS Email Mimicry (KMail / OpenSSL 3.x) выбирается автоматически при подключении к порту 993.
# Любой параметр этой секции также может быть точечно переопределен в query-строке `imap_dsn`.
[imap]
# Время жизни неактивной клиентской сессии до освобождения ее виртуального IP (в мс, 3 минуты)
session_ttl_ms = 180000

# Интервал перевхода серверного воркера в IDLE в состоянии покоя (без активного трафика) для обхода NAT и RFC 2177 (в мс, 10 сек)
idle_refresh_interval_ms = 10000

# Короткий интервал удержания IDLE во время активного обмена трафиком (в мс, 400 мс).
# Исключает 5–10 секундные провалы скорости, когда уведомление `* N EXISTS` от Mail.ru попадает в «Слепое окно» между FETCH и IDLE.
idle_active_poll_ms = 400

# Время удержания быстрого режима опроса (`idle_active_poll_ms`) после последнего принятого или отправленного пакета (в мс, 5 сек).
# По истечении этого окна без трафика воркер плавно переходит на редкий `idle_refresh_interval_ms`.
idle_active_window_ms = 5000

# Тайм-аут ожидания ответа на команду IMAP (LOGIN, CAPABILITY, SELECT, APPEND, FETCH, STORE, EXPUNGE) в мс
command_timeout_ms = 15000

# Интервал фоновой проверки и очистки зависших клиентских сессий (в мс)
cleanup_interval_ms = 30000

# Пауза перед переподключением к ящику при ошибке или срабатывании анти-спам лимита THROTTLED / OVERQUOTA (в мс)
throttle_backoff_ms = 30000

# Максимальный размер одной склеенной пачки IP-пакетов до шифрования (в КБ, поддерживается от 4 до 512 КБ без переполнения u16).
# 128 КБ позволяет передавать крупные окна TCP за меньшее число команд APPEND/FETCH.
max_batch_kb = 128

# Задержка микро-коалесценции батчера перед отправкой первого письма (в мс, 5..50)
batch_coalesce_ms = 15

# Порог накопления прочитанных писем для ленивого пакетного удаления (UID STORE +FLAGS.SILENT (\Deleted) + UID EXPUNGE).
# Вместо удаления по 1–3 письма после каждого FETCH сервер копит прочитанные UID и удаляет их одной пачкой.
expunge_batch_size = 25

# Пауза отсутствия новых входящих писем перед фоновой очисткой накопленных прочитанных UID, даже если их меньше `expunge_batch_size` (в мс)
expunge_idle_delay_ms = 1500

# Максимальное окно неподтвержденных батчей в полете до срабатывания Backpressure
max_inflight_batches = 35

# Емкость очереди пакетов клиентского Downlink-роутера (защита от Bufferbloat при пиковых всплесках)
tx_queue_capacity = 256

# Автоматическое определение поддержки расширения `LITERAL+` / `LITERAL-` по ответу `CAPABILITY` после `LOGIN`.
# Если сервер поддерживает `LITERAL+`, команда `APPEND` отправляет заголовок `{size+}\r\n` и MIME-тело в одном TLS-буфере за 1 RTT без ожидания `+ go ahead`.
literal_plus_auto = true

# =========================================================================
# Профили браузерной мимикрии L4 (TLS ClientHello) и L7 (HTTP/2 + WebSocket)
# =========================================================================
# Используются сервером при исходящих обращениях к Контур.Толк (WRTC) и внешним узлам.
# Встроенные дефолты зашиты в бинарник и продублированы здесь для возможности переопределения.

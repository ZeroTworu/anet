# =========================================================================
# ANET Server: Настройки виртуальной сети
# =========================================================================
[network]
# IP-адрес сети, которая будет создана для VPN-клиентов.
# Все клиенты будут получать IP-адреса из этого диапазона.
net = "172.112.222.0"

# Маска подсети для виртуальной сети. Определяет размер сети
# и количество доступных IP-адресов для клиентов.
mask = "255.255.255.0"

# IP-адрес шлюза внутри виртуальной сети. Этот адрес будет использоваться
# клиентами как шлюз по умолчанию для маршрутизации всего их трафика.
gateway = "172.112.222.1"

# IP-адрес, который будет присвоен TUN-интерфейсу самого сервера.
# Этот адрес должен находиться в той же подсети, что и `net`.
self_ip = "172.122.222.2"

# Имя, которое будет присвоено виртуальному сетевому TUN-интерфейсу
# на стороне сервера.
if_name = "anet-server"

# Максимальный размер пакета (MTU) для TUN-интерфейса. Этот параметр
# критически важен для производительности. Зажат на 1400 для создания запаса
# под заголовки QUIC/UDP/IP и предотвращения IP-фрагментации на сетевом адаптере.
mtu = 1400

# =========================================================================
# ANET Server: Основные настройки сервера
# =========================================================================
[server]
# IP-адрес и порт, на котором сервер будет слушать входящие UDP-соединения.
# "0.0.0.0" означает, что сервер будет принимать подключения на всех доступных
# сетевых интерфейсах.
quic_bind_to = "0.0.0.0:4519"
ssh_bind_to = "0.0.0.0:822"
vnc_bind_to = "0.0.0.0:56678"

websocket_bind_to = "0.0.0.0:8080" # Биндим на локалхост для Nginx
websocket_path = "/socket"

ahttp_bind_to = "127.0.0.1:8081" # Биндим на локалхост для Nginx
ahttp_path = "/api/v2/telemetry"

ssh_host_key = "/opt/anet/anet_ssh_host_key"

# Аварийный DNS-over-HTTPS транспорт (ASTP-L): Сервер слушает стандартный UDP:53
doh_bind_to = "0.0.0.0:53"

# Маскированный транспорт WebRTC поверх Контур.Толк (Ktalk / Jitsi SFU)
# wrtc_room_url = "wrtc://example.ktalk.ru/example-room-id"
# wrtc_mode = "media_video"              # Режим транспорта: "media_video" (Fake Video Track over DTLS-SRTP / JVB) | "p2p_direct" | "jvb_datachannel" | "ws" | "auto"
wrtc_media_keepalive_interval_ms = 20 # Эмуляция Opus тишины (мс) для предотвращения таймаута JVB
wrtc_ping_interval_secs = 30          # Двойной пинг WebSocket и XMPP (сек)
wrtc_fallback_jvb_ip = "89.169.16.6"  # Fallback IP медиасервера JVB при отсутствии в Jingle
wrtc_fallback_jvb_port = 10002        # Fallback UDP порт JVB

# =========================================================================
# ANET Server: Аварийный DNS-туннель (DoH / Hybrid UDP DNS / ASTP-L)
# =========================================================================
# Сервер выступает в роли авторитетного DNS-сервера (UDP:53) для выделенной доменной зоны.
# Клиенты направляют запросы через независимые публичные DoH (`doh://`) и UDP (`udp://`) резолверы,
# которые пересылают их на данный авторитетный сервер.
# Поддерживается двусторонний канальный ARQ/SACK/NACK, дедупликация UDP-ретраев резолверов
# и мгновенная выдача ответов TXT с флагом MORE_DATA_PENDING.
[doh_transport]
# Авторитетная доменная зона, делегированная на данный сервер через NS-запись
domain = "t1.anet-vpn.com"

# Максимальное время микро-удержания входящего poll-запроса (в миллисекундах).
# Рекомендуется 20..35 мс, чтобы рекурсивные резолверы не делали UDP-ретраев и не пессимизировали зону.
poll_hold_timeout_ms = 25

[ahttp]
# Пути, соответствующие путям в client.toml
handshake_path = "/handshake"
auth_path = "/auth"
traffic_path = "/traffic"

# Лимит буфера чтения HTTP-заголовков для защиты веб-сервера от DoS/Slowloris атак
max_header_bytes = 16384

# Маска HTTP-заголовков для ответа клиенту в фазе Traffic.
# Вы можете менять Content-Type (например, на image/jpeg), добавлять любые фейковые куки
# или кастомные заголовки вроде X-Cache-Status: HIT для мимикрии под кэш-промахи CDN.
# ВАЖНО: Символы {} обязательны — в них сервер автоматически подставит размер бинарной пачки (Content-Length).
response_headers = """
HTTP/1.1 200 OK
Content-Type: video/mp4
Cache-Control: no-cache, no-transform, private, must-revalidate
Pragma: no-cache
X-Accel-Buffering: no
Content-Length: {}
Connection: keep-alive\n\n"""

# Максимальный размер скользящего окна реассемблирования на сервере
reassembly_queue_max_size = 1024

# Бюджет коалесценции downlink-пакетов (в байтах).
# Рекомендуется 128 КБ (131072) для баланса пропускной способности и низкого джиттера.
coalesce_budget_bytes = 131072

# Задержка удержания poll-сессии сервером (в миллисекундах) при отсутствии пакетов.
# Рекомендуемый диапазон: 20 - 30 мс.
poll_timeout_ms = 25

# =========================================================================
# ANET Server: Аутентификация и авторизация
# =========================================================================
[authentication]
# Список "отпечатков" (fingerprints) публичных ключей клиентов, которым
# разрешено подключаться к серверу. Отпечаток генерируется утилитой
# `anet-keygen client`. Если клиент с другим отпечатком попытается
# подключиться, его запрос будет отклонен.
allowed_clients = []

# Список URL серверов авторизации (например, ["http://127.0.0.1:3000/api/v1"])
auth_servers = []

auth_server_token = ""

# =========================================================================
# ANET Control Plane: фактическое состояние узла в панели управления
# =========================================================================
[control_plane]
# UUID должен совпадать с UUID узла, созданного в ANet WebUI.
# Пустые node_id или url отключают heartbeat.
node_id = ""
url = "http://127.0.0.1:3000/api/v1"
# Индивидуальный credential ноды, выпущенный в админке. Панель показывает его
# только один раз и хранит у себя лишь SHA-256 хэш этого значения.
token = ""
heartbeat_interval_seconds = 15


# =========================================================================
# ANET Server: Криптографические ключи и сертификаты
# =========================================================================
[crypto]
# Сертификат сервера в формате PEM. Он используется для установления
# QUIC/TLS сессии. Клиент должен доверять этому сертификату.
# Содержимое файла `cert.pem` вставляется прямо сюда.
quic_cert = """
-----BEGIN CERTIFICATE-----
... (Содержимое cert.pem)
-----END CERTIFICATE-----
"""

# Приватный ключ для QUIC-сертификата в формате PEM.
# Содержимое файла `key.pem` вставляется прямо сюда.
# ВАЖНО: Храните этот ключ в секрете.
quic_key = """
-----BEGIN PRIVATE KEY-----
... (Содержимое key.pem)
-----END PRIVATE KEY-----
"""

# Приватный ключ сервера для подписи в формате Base64. Этот ключ
# используется для подписи эфемерного DH-ключа сервера на этапе рукопожатия.
# Это позволяет клиенту убедиться, что он говорит с настоящим сервером,
# а не с самозванцем. Генерируется утилитой `anet-keygen server`.
# ВАЖНО: Храните этот ключ в секрете.
server_signing_key = ""

# =========================================================================
# Настройки вывода статистики соединения
# =========================================================================
[stats]
# Включить (`true`) или выключить (`false`) периодический вывод в лог
# детальной статистики о состоянии QUIC-соединения. Полезно для
# отладки и мониторинга производительности.
# По умолчанию: false
enabled = true

# Интервал в минутах, с которым будет выводиться статистика в лог.
# Установите значение > 0.
# По умолчанию: 1
interval_minutes = 1

# =========================================================================
# Настройки маскировки трафика (Stealth)
# =========================================================================
# Эти параметры помогают скрыть факт использования VPN от систем DPI,
# изменяя размер пакетов и время их отправки.
[stealth]

# -------------------------------------------------------------------------
# Выравнивание размера пакетов (Padding)
# -------------------------------------------------------------------------
# Определяет "шаг" в байтах, до которого будет дополняться размер каждого пакета.
#
# Зачем это нужно:
# Без паддинга DPI видит реальный размер данных:
#   - 50-100 байт -> скорее всего, ввод команд в консоли (SSH) или ACK.
#   - 148 байт -> сигнатура WireGuard handshake.
#   - 1000+ байт -> передача файлов/видео.
# С паддингом все пакеты выглядят как унифицированные "кирпичи" (например, 64, 128, 192...).
# Это полностью скрывает тип активности пользователя.
#
# Значения:
#   0   - Отключено (режим "Хаос"). Пакеты имеют естественный размер.
#         Полезно против нейросетей, ищущих искусственные паттерны.
#   64  - (Рекомендуется) Баланс между скрытностью и расходом трафика.
#   128 - Высокая скрытность, но чуть больше накладных расходов (overhead).
#
# По умолчанию: 64
padding_step = 64

# -------------------------------------------------------------------------
# Имитация задержек сети (Jitter)
# -------------------------------------------------------------------------
# Добавляет случайную задержку перед отправкой каждого пакета.
# Значения указываются в наносекундах (ns).
# 1 миллисекунда (ms) = 1 000 000 наносекунд (ns).
#
# Зачем это нужно:
# DPI анализирует временные интервалы (Timing Analysis). Если пакет
# приходит на сервер и мгновенно улетает дальше, DPI понимает, что это прокси.
# Джиттер "размазывает" время доставки и меняет порядок пакетов (Reordering),
# делая поток похожим на работу обычной перегруженной сети.
#
# Рекомендации:
# 1. "Минимальный" (почти не влияет на пинг, сбивает точные тайминги):
#    min = 100000   (0.1 ms)
#    max = 500000   (0.5 ms)
#
# 2. "Сбалансированный" (хороший стелс, пинг +3мс):
#    min = 1000000  (1 ms)
#    max = 5000000  (5 ms)
#
# 3. "Параноидальный" (максимальная маскировка, пинг +15мс, возможны лаги в играх):
#    min = 5000000  (5 ms)
#    max = 20000000 (20 ms)
#
# Установите min и max в 0, чтобы отключить.

# Минимальная задержка (в наносекундах)
# По умолчанию: 1000000 (1 ms)
min_jitter_ns = 1000000

# Максимальная задержка (в наносекундах)
# По умолчанию: 5000000 (5 ms)
max_jitter_ns = 5000000

# =========================================================================
# Настройки транспорта QUIC (Quinn Transport Configuration)
# Эта секция определяет, как сервер будет управлять трафиком для всех
# подключенных клиентов. Так как сервер обслуживает множество соединений
# с разными характеристиками, настройки должны быть достаточно фрагментированы.
# =========================================================================
[quic_transport]
# -------------------------------------------------------------------------
# Алгоритм контроля перегрузки (Congestion Control Algorithm)
# -------------------------------------------------------------------------
# "bbr": Настоятельно рекомендуется для сервера. Этот алгоритм позволяет
#     эффективно работать с клиентами на самых разных типах сетей
#     (стабильных, с потерями, с высоким пингом), адаптируясь под
#     каждое соединение индивидуально.
# "cubic": Менее предпочтителен для сервера, так как может показывать
#     сниженную производительность для клиентов с нестабильным подключением.
algorithm = "bbr"

# -------------------------------------------------------------------------
# Обобщенные параметры канала
# -------------------------------------------------------------------------
# Среднеожидаемое время кругового пути (RTT) от клиентов в миллисекундах.
# Это значение используется как начальная точка для всех новых соединений.
# BBR быстро скорректирует его до реального значения для каждого клиента.
expected_rtt_ms = 60

# Оценка пропускной способности канала сервера для исходящего трафика
# (Download для клиента) в мегабитах в секунду.
# Укажите реальную скорость сетевого интерфейса вашего сервера. Это
# значение используется для автоматического расчета `send_window`.
bandwidth_down_mbps = 1000

# Оценка пропускной способности канала сервера для входящего трафика
# (Upload от клиента) в мегабитах в секунду.
# Используется для расчета `receive_window` и для настройки BBR.
bandwidth_up_mbps = 1000

# -------------------------------------------------------------------------
# Размеры буферов (Flow Control Windows)
# Рекомендуется оставить эти параметры незаполненными для автоматического расчета.
# -------------------------------------------------------------------------
# Размер окна приема для отдельного QUIC-потока от клиента, в байтах.
stream_receive_window = 33554432 # 32 MB (Синхронизировано с буфером соединения)

# Общий размер окна приема для всего соединения, в байтах. Ограничивает,
# какой объем данных сервер готов буферизовать от одного клиента.
# Напрямую влияет на скорость исходящего трафика (upload) клиента.
receive_window = 33554432        # 32 MB

# Общий размер окна отправки, в байтах. Определяет, какой объем данных
# сервер может отправить одному клиенту без ожидания подтверждений.
# Напрямую влияет на скорость входящего трафика (download) клиента.
send_window = 33554432           # 32 MB

# -------------------------------------------------------------------------
# Дополнительные оптимизации
# -------------------------------------------------------------------------
# Включение Generic Segmentation Offload (GSO). На сервере эта опция
# особенно важна, так как значительно снижает нагрузку на CPU при
# обслуживании множества высокоскоростных соединений.
enable_gso = true

# Таймаут неактивности соединения в секундах. Рекомендуется установить
# то же значение, что и на клиенте, для синхронного поведения.
idle_timeout_seconds = 21600

# Максимальный размер пакета для механизма Path MTU Discovery.
# Это "потолок", выше которого QUIC не будет пытаться поднять MTU.
# Зажато на 1400 для предотвращения фрагментации и скрытых потерь пакетов на уровне IP.
max_mtu = 1400
# -------------------------------------------------------------------------
# Интервал поддержания активности соединения (Keep-Alive)
# -------------------------------------------------------------------------
# Периодичность автоматической отправки минимальных зашифрованных пингов
# в секундах во время простоя (когда нет полезного трафика).
#
# Зачем это нужно:
# Протокол UDP не хранит состояние соединения (stateless). Когда вы заблокировали
# экран телефона или отошли от компьютера, полезный трафик перестает идти.
# В этот момент домашние роутеры и сотовые операторы начинают отсчет тайм-аута.
# Из-за нехватки адресов они очень быстро (часто уже через 30-60 секунд) закрывают
# временные порты маршрутизации в своих таблицах трансляции адресов (UDP NAT Timeout).
#
# Если это произойдет, сервер потеряет обратный путь до клиента, и туннель зависнет,
# а при разблокировке телефона соединение придется устанавливать заново.
#
# Регулярный Keep-Alive отправляет крошечные невидимые пакеты, которые «прогревают»
# сетевой тракт, заставляя оборудование провайдера постоянно держать порт открытым.
#
# Рекомендации:
#   0  - Отключено. (Допустимо только на стабильном проводном домашнем интернете).
#   15 - 25 - (Рекомендуется) Оптимальный интервал для мобильных сетей. Удерживает
#        NAT-таблицы открытыми, не расходуя при этом заряд батареи телефона.
#
# По умолчанию: 20
keep_alive_interval_seconds = 20

# =========================================================================
# Настройки eBPF-шейпера трафика (per-user speed_limit)
# =========================================================================
[shaper]
# Включает ограничение скорости на TUN-интерфейсе через встроенный eBPF
# (крейт anet-ebpf, собран прямо внутрь бинарника anet-server).
# Требует CAP_BPF + CAP_NET_ADMIN (см. contrib/systemd/anet-vpn.service)
# и qdisc `fq` на TUN-интерфейсе (настраивается автоматически при старте).
# По умолчанию: false
enabled = false

# =========================================================================
# Тонкая настройка транспорта WebRTC / Jitsi (секция [wrtc])
# =========================================================================
# Эти параметры управляют тайм-аутами сигнализации KTalk/XMPP, буферами
# сокетов UDP/SCTP, лимитами MTU для медиа-потока VP8 и сторожевыми
# таймерами (watchdog) при работе WebRTC-сервера (если задан `wrtc_domain`).
[wrtc]
# Тайм-аут TCP/TLS-подключения к HTTP API KTalk при создании/входе в комнату (сек).
http_connect_timeout_secs = 10

# Общий тайм-аут выполнения HTTP-запросов к API KTalk (сек).
http_request_timeout_secs = 15

# Тайм-аут установки XMPP WebSocket соединения и входа в MUC-комнату Jitsi (сек).
xmpp_handshake_timeout_secs = 15

# Тайм-аут записи одного фрейма в WebSocket (XMPP или резервный Colibri-WS) (сек).
ws_write_timeout_secs = 5

# Тайм-аут подключения резервного канала управления Colibri-WS (сек).
colibri_ws_connect_timeout_secs = 10

# Размер системных буферов сокета UDP (SO_RCVBUF / SO_SNDBUF) для медиа-трафика (в байтах).
# 4 МБ предотвращают потерю пакетов (packet drop) ядром ОС при микровсплесках видеопотока.
udp_socket_buffer_size = 4194304

# Количество выделенных потоков реактора WebRTC для обработки входящих/исходящих RTP-пакетов.
reactor_pool_size = 4

# Время отсутствия ответов STUN/ICE до перехода соединения в статус Disconnected (мс).
ice_disconnected_timeout_ms = 10000

# Время до полного разрыва ICE-соединения (статус Failed) после потери связности (мс).
ice_failed_timeout_ms = 25000

# Интервал отправки проверочных STUN Binding Request (ICE keep-alive) (мс).
ice_keepalive_interval_ms = 2000

# Максимальный размер приемного буфера SCTP (для транспорта `dc` / DataChannel) (в байтах).
sctp_max_receive_buffer_size = 4194304

# Максимальный размер полезной нагрузки SCTP-пакета внутри DTLS (в байтах).
sctp_mtu = 1280

# Размер буфера чтения одного входящего UDP/RTP пакета в движке WebRTC (в байтах).
receive_mtu = 1600

# Запас (overhead) в байтах, вычитаемый из `[network] mtu` при расчете эффективного MTU
# для видео-транспорта (`media_video`) и максимального размера батча (`max_video_batch_bytes`).
# Учитывает заголовки внешнего IPv4 (20B) + UDP (8B) + SRTP (16B) + RTP (12B) +
# VP8 Payload Descriptor/Header (24B) + тег маршрутизации JVB (2B) + заголовок ASTP (28B) = 110 байт.
# Гарантирует отсутствие IP-фрагментации и черных дыр PMTU на магистралях хостинг-провайдеров.
video_mtu_overhead = 110

# Интервал отправки фоновых холостых VP8-кадров (keep-alive) при отсутствии трафика (мс).
# Необходим, чтобы медиа-мост Jitsi (JVB) не замораживал и не отключал видео-трек.
video_keepalive_interval_ms = 1000

# Время нахождения PeerConnection в состоянии Disconnected до пересоздания пира (сек).
watchdog_disconnected_timeout_secs = 8

# Льготный период на открытие хотя бы одного канала управления (DataChannel или Colibri-WS)
# после старта сессии до срабатывания сторожевого таймера (сек).
watchdog_channel_grace_secs = 12

# Тайм-аут ожидания штатного закрытия PeerConnection при завершении сессии (сек).
peer_close_timeout_secs = 3

# Интервал отправки внутритуннельных пингов (ASTP Keep-Alive) для проверки живого тракта (сек).
tunnel_ping_interval_secs = 15

# Тайм-аут отсутствия входящих пакетов от клиента до закрытия его WRTC-сессии (сек).
tunnel_ping_timeout_secs = 45

# Интервал профилактической ротации пустой комнаты на сервере при отсутствии клиентов (сек).
# По умолчанию: 1800 (30 минут).
server_idle_room_rotation_secs = 1800

# =========================================================================
# Профили браузерной мимикрии L4 (TLS ClientHello) и L7 (HTTP/2 + WebSocket)
# =========================================================================
# Используются сервером при исходящих обращениях к Контур.Толк (WRTC) и внешним узлам.
# Встроенные дефолты зашиты в бинарник и продублированы здесь для возможности переопределения.
[[browser_profiles]]
name = "Chrome"
cipher_list = "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-RSA-AES128-SHA:ECDHE-RSA-AES256-SHA:AES128-GCM-SHA256:AES256-GCM-SHA384:AES128-SHA:AES256-SHA"
curves = "X25519MLKEM768:X25519:P-256:P-384"
sigalgs = "ecdsa_secp256r1_sha256:rsa_pss_rsae_sha256:rsa_pkcs1_sha256:ecdsa_secp384r1_sha384:rsa_pss_rsae_sha384:rsa_pkcs1_sha384:rsa_pss_rsae_sha512:rsa_pkcs1_sha512"
grease = true
permute_extensions = true
session_ticket = true
ocsp_stapling = true
signed_cert_timestamps = true
ech_grease = true
alps_h2 = true
cert_compression = ["brotli"]
h2_initial_stream_window_size = 6291456
h2_initial_connection_window_size = 15728640
h2_max_header_list_size = 262144
ws_headers_order = [
    "Host",
    "Connection",
    "Pragma",
    "Cache-Control",
    "User-Agent",
    "Upgrade",
    "Origin",
    "Sec-WebSocket-Version",
    "Accept-Encoding",
    "Accept-Language",
    "Sec-WebSocket-Key",
    "Sec-WebSocket-Extensions",
]
user_agents = [
    "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/135.0.0.0 Safari/537.36",
    "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/136.0.0.0 Safari/537.36",
]
headers = [
    "Accept-Language: ru-RU,ru;q=0.9,en-US;q=0.8,en;q=0.7",
    "Accept-Encoding: gzip, deflate, br, zstd",
]


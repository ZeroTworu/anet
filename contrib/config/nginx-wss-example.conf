# ============================================================================
# anet — пример nginx-конфига для белого IP в облаке (терминация wss://).
#
# Топология:
#   [клиент] --wss://--> [ТСПУ / красная зона]
#            --wss://--> [этот nginx, белый IP, реальный TLS-сертификат]
#            --ws://-->   [серая зона]
#                     --> [anet_server]
#                     --> [чистый интернет]
#
# anet_server никогда не видит TLS и не должен его видеть: вся TLS-граница
# (настоящий Let's Encrypt сертификат + маскировка под обычный сайт для
# активного зондирования ТСПУ) — здесь, и только здесь.
# ============================================================================

# HTTP -> HTTPS редирект + ACME-challenge для certbot
server {
    listen 80;
    listen [::]:80;
    server_name example.com;                      # ЗАМЕНИТЬ на свой домен

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com;                       # ЗАМЕНИТЬ на свой домен

    # Настоящий сертификат Let's Encrypt — не самоподписанный.
    # Получить: certbot --nginx -d example.com
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # --- anet ASTP-канал -----------------------------------------------
    # Путь ДОЛЖЕН совпадать с server.websocket_path в конфиге anet_server.
    location /your_websocket_path {
        proxy_pass http://127.0.0.1:8080;          # адрес anet_server в серой зоне
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;                  # иначе nginx рвёт долгоживущий WS
        proxy_send_timeout 3600s;
    }

    # --- Decoy-контент ---------------------------------------------------
    # Всё остальное должно выглядеть как обычный сайт: без этого активное
    # зондирование ТСПУ отличит сервер по "пустому" ответу на любой другой путь.
    root /var/www/decoy-site;
    index index.html;
    location / {
        try_files $uri $uri/ =404;
    }
}

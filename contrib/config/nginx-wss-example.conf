server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Слушаем все запросы
    server_name _;

    # ---------------------------------------------------------
    # 1. ЗАГЛУШКА ДЛЯ СЕРФИНГА И БОТОВ (Default)
    # Любой сторонний запрос или скан ТСПУ попадет сюда
    # ---------------------------------------------------------
    location / {
        root /var/www/html;
        index index.html index.htm;
    }

    # ---------------------------------------------------------
    # 2. МАРШРУТ WEBSOCKET (WSS Transport)
    # ---------------------------------------------------------
    location /socket {
        # Защита от прямого захода браузером: пропускаем только WebSockets
        if ($http_upgrade !~* "websocket") {
            return 404;
        }

        # Проксируем на порт ANet-сервера (Websocket Bind)
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # Заголовки апгрейда соединения
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        # Проброс реальных IP клиентов
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Критично для VPN: отключаем буферизацию
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---------------------------------------------------------
    # 3. МАРШРУТ AHTTP STREAM (Скрытный транспорт Chunked)
    # ---------------------------------------------------------
    location /api/v2/telemetry {
        
        # Для AHTTP нам НЕ нужны заголовки апгрейда!
        # Трафик выглядит как обычные GET/POST запросы.
        
        # Проксируем на порт ANet-сервера (AHTTP Bind)
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;

        # Проброс реальных IP клиентов
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Указываем Nginx не трогать Chunked-кодировку
        proxy_set_header Transfer-Encoding $http_transfer_encoding;

        # Критично для AHTTP: полностью отключаем буферизацию тела ответа и запроса, 
        # иначе Nginx будет ждать окончания "скачивания" (которое бесконечное)
        proxy_buffering off;
        proxy_request_buffering off;

        # Отключаем кэширование на уровне веб-сервера
        proxy_cache off;

        # Таймауты поддержания бесконечного потока
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

server {
    listen 80;
    server_name localhost;

    # 1. СТАТИКА И ВЕБ-ИНТЕРФЕЙС
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 2. МАРШРУТ СКАЧИВАНИЯ КЛИЕНТСКИХ КОНФИГОВ
    location /download/ {
        alias /opt/download/;
        autoindex on;
    }

    # 3. АВТОРИЗАЦИЯ И УПРАВЛЕНИЕ (БЭКЕНД ПАНЕЛИ)
    location /api/ {
        proxy_pass http://anet-auth:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------------------------------------------------------
    # 4. МАРШРУТ WEBSOCKET (WSS Transport)
    # ---------------------------------------------------------
    location /socket {
        if ($http_upgrade !~* "websocket") {
            return 404;
        }

        # Перенаправляем на порт WS-сервера на хосте
        proxy_pass http://host.docker.internal:8080;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Отключаем буферизацию кадров
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Заголовки для обхода кэширования и буферизации на CDN
        add_header X-Accel-Buffering "no" always;
        add_header Cache-Control "private, no-store, no-cache, max-age=0, must-revalidate" always;
    }

    # ---------------------------------------------------------
    # 5. МАРШРУТ AHTTP STREAM (Скрытный транспорт Chunked)
    # ---------------------------------------------------------
    location /api/v2/telemetry {
        # Перенаправляем на порт AHTTP-сервера на хосте
        proxy_pass http://host.docker.internal:8081;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Transfer-Encoding $http_transfer_encoding;

        # Полностью отключаем буферизацию
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;

        proxy_connect_timeout 60s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Инструкции для CDN (не буферизовать, не оптимизировать)
        # add_header X-Accel-Buffering "no" always;
        # add_header Cache-Control "private, no-store, no-cache, max-age=0, must-revalidate, no-transform" always;
        # add_header Pragma "no-cache" always;
    }
}
